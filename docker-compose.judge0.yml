version: '3.8'

services:
  # Judge0 - основной сервис компиляции
  judge0-server:
    image: judge0/judge0:1.13.0
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - REDIS_HOST=judge0-redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=judge0-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=YourSecurePassword123
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
    depends_on:
      - judge0-redis
      - judge0-postgres
    restart: unless-stopped
    networks:
      - judge0-network

  # Redis для очереди задач
  judge0-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - judge0-redis-data:/data
    restart: unless-stopped
    networks:
      - judge0-network

  # PostgreSQL для хранения результатов
  judge0-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=YourSecurePassword123
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - judge0-network

networks:
  judge0-network:
    driver: bridge

volumes:
  judge0-redis-data:
  judge0-postgres-data:
